# ~/.config/herdr/config.toml — herdr (agent multiplexer) settings.
#
# Only this file is tracked; the rest of ~/.config/herdr is runtime state (logs,
# sockets, session snapshots). Keys left at herdr's default are omitted —
# `herdr --default-config` prints them. Check with `herdr config check`.
onboarding = false

# Toasts as macOS notifications so a blocked or finished agent reaches you
# when the herdr window is not in front. "herdr" keeps them in-TUI only.
[ui.toast]
delivery = "system"

# One sound for done and needs-attention. Relative paths resolve from this
# file's directory, so the clip lives in ~/.config/herdr/sounds/ (untracked:
# only config.toml is linked from the dotfiles repo). No ~ expansion here.
# The same file backs the Claude-in-tmux alert in .config/tmux/tmux-agent-state.
# Herdr accepts mp3 only. Missing file = herdr's default sound.
[ui.sound]
path = "sounds/alert.mp3"

# Sidebar: state first, then which repo and tab, then the agent's own title
# (omp reports its current todo/phase as the terminal title).
[ui.sidebar.agents]
rows = [
  ["state_icon", "state_text", "workspace", "tab"],
  ["agent", "terminal_title_stripped"],
]

[ui.sidebar.spaces]
rows = [
  ["workspace", "git_status"],
]

# Prefix matches tmux (ctrl+a). prefix+n / prefix+p walk spaces like tmux
# windows; prefix+shift+1..9 jump to a space by sidebar index. Tabs move to
# prefix+ctrl+n / prefix+ctrl+p so they do not collide. new_workspace stays on
# the default prefix+shift+n.
[keys]
prefix = "ctrl+a"
next_workspace = "prefix+n"
previous_workspace = "prefix+p"
switch_workspace = "prefix+shift+1..9"
next_tab = "prefix+ctrl+n"
previous_tab = "prefix+ctrl+p"
