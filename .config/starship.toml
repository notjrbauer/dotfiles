# ~/.config/starship.toml
# Mirrors the old spaceship layout. Colours use named ANSI slots, so they
# inherit the terminal's catppuccin-mocha palette automatically.

add_newline = false

# Safety net for git in very large working trees. fsmonitor is disabled
# globally now, so git_status is a single ~25ms `git status` fork on normal
# repos (measured); this headroom only matters when cd'ing into a huge repo.
command_timeout = 1000

format = """
$directory\
$git_branch\
$git_status\
$python\
$cmd_duration\
$jobs\
$character"""

[directory]
# Dials: raise truncation_length to show more of the path; set
# truncate_to_repo = true to re-anchor to the repo root (shows just the
# repo name at its root). With it off you get the real trailing path.
truncation_length = 3          # show up to 3 trailing path components
truncate_to_repo = false       # show the actual path tail, not just repo root
truncation_symbol = "…/"       # marker shown when the path was shortened
style = "blue"
repo_root_style = "bold blue"  # make the repo name stand out
read_only = " "
read_only_style = "red"

[git_branch]
symbol = " "
style = "purple"

[git_status]
style = "red"

[cmd_duration]
min_time = 500               # only show for commands slower than 500ms
format = "[$duration]($style) "
style = "yellow"

[python]
symbol = " "
format = 'using [${symbol}${version}]($style) '
style = "green"

[jobs]
symbol = "✦ "

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"
