# vim:fdm=marker expandtab fdc=3 ft=tmux ts=2 sw=2 sts=2:
#
# Hierarchy:
#  Server
#  ㄴSession
#    ㄴWindow
#      ㄴPane

# Terminal layering — tmux owns the C-a layer; the terminals (wezterm
# config/bindings.lua, ghostty config) bind SUPER-only chords and deliberately
# no ctrl keys, so the prefix reaches tmux single-tap. The prefix bindings
# below carry the old wezterm-LEADER muscle memory: splits " % s v, zoom z,
# resize - = ( ) and sticky R-mode, copy mode [, windows c/n/p/Tab, plus bare
# C-h/j/k/l pane navigation (vim/fzf-aware) further down.

# General

# $TERM inside tmux must be tmux/screen or a derivative (see tmux(1)).
# Not a redundant default: TMUX_TERM is baked in at build time and can be
# plain "screen" (no 256color/italics) on a self-compiled tmux.
set -g default-terminal "tmux-256color"

set -g mouse on

# Deliberately no default-shell: it falls back to $SHELL (login shell), so
# there's no hardcoded brew path to break across Intel (/usr/local) vs Apple
# Silicon (/opt/homebrew).

# ESC delay in nvim: https://github.com/neovim/neovim/wiki/FAQ#esc-in-tmux-or-gnu-screen-is-delayed
set -s escape-time 0

# nvim's FocusGained/FocusLost autocmds (autoread, lualine) — off by default.
set -s focus-events on

set -g prefix C-a
unbind C-b
bind C-a send-prefix

# tmux 3.7 put floating panes on `*`. They are real panes, but a window that
# holds one grows a trailing <...> section on #{window_layout} that
# select-layout rejects outright ("invalid layout"), so tmux-snapshot cannot
# put that window back — and `*` is a plausible fat-finger next to the resize
# keys ( and ) below. Upstream calls them an early release and lists restoring
# layouts with them as not yet available.
unbind '*'

# Terminal window title
set -g set-titles on
set -g set-titles-string "[tmux] #T @ #H"

set -g display-time 3500
set -g history-limit 100000

# Let applications reach the terminal through tmux via the DCS wrapper
# (\ePtmux;…\e\\). Claude Code wraps its desktop notifications and OSC 9;4
# progress in exactly that, and without this tmux drops them on the floor.
#
# Two corrections to what this comment used to claim. Clipboard: on macOS
# Claude Code's clipboard path resolves to pbcopy plus `tmux load-buffer -w -`,
# and OSC 52 is only the ssh fallback — so "all" would not open a *Claude Code*
# clipboard hole, just a generic one from any other program in a hidden pane.
# And the cost of "on" is real and was undocumented: per tmux(1) it allows
# passthrough "only if the pane is visible", so every notification from an
# agent working in a background window is dropped — which is precisely when
# you wanted it. "on" stays, because the alerting that actually works is a
# Claude hook running a *command* (see the @agent badge under Windows below):
# a process does not care whether its pane is on screen.
set -g allow-passthrough on

# Start window and pane indexes at 1
set -g base-index 1
set -g pane-base-index 1

# Closing window 2 of 1-2-3-4 leaves 1-3-4 by default, which makes the index
# in the status line something you cannot count on and makes C-a C-h / C-a C-l
# the only honest way to move. Renumbering keeps the list dense.
set -g renumber-windows on

# Killing the attached session detaches the client by default, which drops you
# out of tmux entirely — at the `exec zsh -l` fallback wezterm's launch.lua
# leaves behind, which reads exactly like tmux crashed. Land in the
# most-recent remaining session instead; this whole config is about switching.
set -g detach-on-destroy off

# Appearance — same palette as wezterm colors/custom.lua
# (slightly-altered Catppuccin Mocha; base #1f1f28)

# Truecolor passthrough for the terminals in use
set -ga terminal-overrides ",xterm-256color:RGB,wezterm:RGB,xterm-ghostty:RGB"

# tmux 3.7's built-in feature rows are stale for both terminals here: neither
# advertises sync (DECSET 2026 frame batching — without it a streaming TUI tears)
# nor hyperlinks (OSC 8 — without it tmux stores the link and never emits it, so
# every clickable path an agent prints is dead text). WezTerm reports TERM as
# xterm-256color, which is why the first row and not a wezterm one.
# -ga, never -g: terminal-features is an array and a plain -g collapses it,
# destroying the shipped "xterm*:clipboard:ccolour:cstyle:focus:title" row.
# A source-file does NOT re-evaluate an attached client, so C-a r alone will not
# pick these up. Detach and reattach: C-a d, then `tmux attach`. Do NOT reach for
# `tmux kill-server` — it takes every session on the machine with it, and a
# reattach already does the job. Confirm with:
#   tmux display-message -p '#{client_termfeatures}'
set -ga terminal-features "xterm-256color:hyperlinks:sync:osc7:overline:extkeys"
set -ga terminal-features "xterm-ghostty:hyperlinks:sync:osc7:overline:extkeys"

# Without this tmux never negotiates CSI-u, and Shift+Enter arrives as a bare
# ^M — bit-identical to Enter, with the shift destroyed a layer below any TUI,
# so no keymap in Claude Code or nvim can recover it. Measured in a pane:
# off -> ^M and C-S-k -> ^K; on -> ^[[13;2u and ^[[107;6u. tmux's shipped
# xterm* feature row (clipboard:ccolour:cstyle:focus:title) does not carry
# extkeys, hence adding it above as well.
# Two things to re-check after turning this on, both real: csi-u sends S-Tab as
# CSI 9;2u rather than CSI Z, which some readline/fzf setups stop seeing (fall
# back to `extended-keys-format xterm` if so), and extended keys change tmux's
# internal key identity, so re-test C-Space and C-\ against vim-tmux-navigator.
set -s extended-keys on
set -s extended-keys-format csi-u

set -g status-position top

# Not monitor-activity: it flags a window on *any* output, and an agent
# streams output continuously, so every background agent window sits
# permanently flagged and window-status-activity-style stops meaning anything
# (verified: five echoed lines is enough to latch it). A bell is deliberate —
# Claude Code rings it when a turn ends or it needs permission — so that is
# the signal worth surfacing, and window-status-bell-style below finally fires.
# Requires "preferredNotifChannel": "terminal_bell" in .claude/settings.json:
# Claude Code's desktop notifications cover Ghostty, Kitty and iTerm2, and
# there is no WezTerm channel, so on the daily driver the bell is the only path.
# Jump to whoever rang: prefix M-n / prefix M-p (tmux defaults, kept).
set -g monitor-activity off
set -g monitor-bell on
set -g bell-action any
set -g visual-bell off

# status content: left = session name only; right = clock. Defaults added a
# per-pane border line (pane index + hostname + mouse [z]oom/[x]close buttons)
# and hostname+date on the right — noise on a single laptop.
set -g status-left "[#S] "
# Right is the clock and nothing else. This used to carry a #() that ran the
# snapshot autosave, on the theory that a status-right job was the only
# periodic hook available without a plugin manager. That stopped being true in
# tmux 3.5: the hooks under "Sessions on disk" below fire on the actual events,
# save *before* the fact rather than up to a status-interval after it, and do
# not fork a shell when nothing has changed. Two things the old comment also
# got wrong, worth not re-learning: status-interval is a floor, not a rate
# (tmux re-expands status-right on every status redraw — 9 calls in 9s while a
# window was being renamed), and it fired on far more than opening or closing
# something, because a resize, a bare `cd` and attaching a client all change
# the recorded shape.
set -g status-right ' %H:%M'

# status bar (wezterm tab_bar.background ~ mantle)
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-style "bg=#181825,fg=#89b4fa"
set -g status-right-style "bg=#181825,fg=#a6adc8"

# window list — mirrors wezterm tab_bar active / inactive / hover
set -g window-status-style "bg=#313244,fg=#bac2de"

# The bell is transient; this is the queue. A Claude hook writes the window
# option @agent (see .claude/settings.json -> tmux-agent-state), and the
# window list renders it: red ! = wants you, green * = finished while you were
# elsewhere. The window list is already the WIP limit; this makes it the alert
# surface too. Nothing set window-status-format before, so this displaces
# nothing — but the #{?window_flags,…} tail is mandatory, or the *, -, Z and !
# flags tmux draws by default silently disappear.
set -g window-status-format         "#{?#{==:#{@agent},wait},#[fg=#f38ba8]! ,#{?#{==:#{@agent},done},#[fg=#a6e3a1]* ,}}#I:#W#{?window_flags,#{window_flags}, }"
set -g window-status-current-format "#{?#{==:#{@agent},wait},#[fg=#f38ba8]! ,#{?#{==:#{@agent},done},#[fg=#a6e3a1]* ,}}#I:#W#{?window_flags,#{window_flags}, }"
set -g window-status-current-style "bg=#585b70,fg=#cdd6f4,bold"
set -g window-status-last-style "bg=#313244,fg=#cdd6f4"
set -g window-status-activity-style "bg=#313244,fg=#f9e2af"
set -g window-status-bell-style "bg=#f38ba8,fg=#11111b"

# panes (split = overlay0; active border = blue for visibility)
set -g pane-border-style "fg=#6c7086"
set -g pane-active-border-style "fg=#89b4fa"

# Claude Code writes what it is currently doing to the terminal title, which
# tmux exposes as #{pane_title} — measured: "✳ Claude Code" idle, "✳ Count to
# 40 slowly" mid-turn. So the border is a free per-pane status line. Costs one
# row per pane. Note set-titles-string above uses #T, so the wezterm window
# title has been showing the agent's current task all along; it just reads
# like a hostname string.
set -g pane-border-status top
set -g pane-border-format " #{pane_index}: #{pane_title} "

# messages / command prompt
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#f5c2e7"

# copy mode (selection = surface2, like wezterm selection_bg/fg)
set -g mode-style "bg=#585b70,fg=#cdd6f4"
set -g copy-mode-match-style "bg=#f9e2af,fg=#11111b"
set -g copy-mode-current-match-style "bg=#fab387,fg=#11111b"
set -g copy-mode-mark-style "bg=#f5e0dc,fg=#11111b"

# misc
set -g clock-mode-colour "#89b4fa"
set -g display-panes-colour "#6c7086"
set -g display-panes-active-colour "#89b4fa"
set -g menu-style "bg=#313244,fg=#cdd6f4"
set -g menu-selected-style "bg=#585b70,fg=#cdd6f4"
set -g menu-border-style "fg=#6c7086"
set -g popup-style "bg=#1f1f28,fg=#cdd6f4"
set -g popup-border-style "fg=#6c7086"

# Reload config file
bind r source-file ~/.tmux.conf \; display-message "[tmux] ~/.tmux.conf reloaded!"
bind C-r source-file ~/.tmux.conf \; display-message "[tmux] ~/.tmux.conf reloaded!"

# Clients

bind N switch-client -n
bind P switch-client -p

# Sessions

# One session per project/task, plus long-lived service sessions — so the
# session layer needs its own keys. Defaults that survive this file and are
# worth knowing before adding more: L last-session, $ rename-session and
# , rename-window (both prefill the current name), d detach, D choose-client,
# w window tree, f find-window.
# s is a split here, so the default s (choose-tree -Zs) is gone; S takes it —
# as the fuzzy picker under Pickers below, which falls back to choose-tree when
# fzf is missing. C-s pairs with it (tmux binds nothing to C-s, and tmux reads
# the key in raw mode, so terminal XOFF never sees it).
# The name is sanitized the same way ta/tsvc/tkill do it: ':' separates
# session:window and '.' separates window.pane, so a session called "a.b" or
# "a:b" is created happily and is then unreachable forever — `has-session -t
# a:b` fails with "can't find window: b", and so does kill-session. Both become
# '_'. Done in a run-shell rather than inline because tmux has no string
# substitution for a command-prompt %% argument. Single-quoted outer argument
# so the inner \$n survives tmux's own expansion.
bind C-s command-prompt -p "New session:" 'run-shell "n=\$(printf %s \"%%\" | tr .: __); [ -n \"\$n\" ] || exit 0; tmux has-session -t \"=\$n\" 2>/dev/null || tmux new-session -d -s \"\$n\" -c \"#{pane_current_path}\"; tmux switch-client -t \"=\$n\""'

# A long-lived tunnel/connection command holds its pane for the whole workday.
# Parking it in its own detached session keeps it clear of q/Q/C-q aimed at a
# work session, and stops it from occupying a split. T attaches, creating the
# session on first use — has-session -t= is an exact-name match, so it won't
# latch onto a prefix like "tunnel-scratch".
bind T if-shell "tmux has-session -t=tunnel" { switch-client -t=tunnel } { new-session -d -s tunnel ; switch-client -t=tunnel }

# Windows

bind c new-window -c "#{pane_current_path}"
# Task window: prompt for a name, nvim left + claude right at 40%. One window
# per task — the window list is the WIP limit; zoom (z), don't resize.
# This shadows the default customize-mode, which is then reachable from
# nowhere — the old comment claimed mouse and menus still reached it; they do
# not. `C-a :customize-mode` is the way in if you want it.
# The name is sanitized like C-s above: '.' and ':' are tmux's own window.pane
# and session:window separators, so a window called "tmux.md" is unreachable
# as main:tmux.md. Same rule the git and path pickers already apply.
bind C command-prompt -p "Task:" 'run-shell "n=\$(printf %s \"%%\" | tr .: __); [ -n \"\$n\" ] || exit 0; tmux new-window -n \"\$n\" -c \"#{pane_current_path}\" nvim; tmux split-window -h -l 40% -c \"#{pane_current_path}\" claude; tmux select-pane -L"'
bind Tab last-window
# Deliberately not -r. Repeat keeps the prefix table armed for repeat-time
# (500ms) after the key, and C-h / C-l are also bound bare in the root table
# for pane navigation further down — so within that window a bare C-h moved a
# *window* instead of a pane. Press the prefix again; the pane keys always work.
bind C-h select-window -t :-
bind C-l select-window -t :+
# Guarded: tmux's own shipped default for a kill is confirm-before, and this
# file had replaced it with three unguarded keys (q, Q, C-q) sitting next to
# each other. A window can hold an agent mid-task.
bind Q confirm-before -p "kill window #W (#{window_panes} panes)? (y/n)" kill-window

# Panes

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# q stays unguarded on purpose — a pane is cheap and the muscle memory is
# worth keeping. C-q is not: it takes every agent pane in the session mid-task,
# and it sits one Ctrl away from q.
bind q kill-pane
bind C-q confirm-before -p "kill session #S (#{session_windows} windows)? (y/n)" kill-session
bind b break-pane
bind i display-panes

# One-shot resizes (wezterm LEADER -/=/(/), same 10-cell steps)
bind - resize-pane -U 10
bind = resize-pane -D 10
bind ( resize-pane -L 10
bind ) resize-pane -R 10

# Resize mode: prefix R, then h/j/k/l repeatedly; Escape or q exits.
# Mirrors wezterm's LEADER-r resize_pane key table (prefix r reloads the conf
# here, hence R). switch-client -T only lasts for one key, so every resize
# re-arms the table — sticky like wezterm's one_shot = false.
bind R switch-client -T resize
bind -T resize h resize-pane -L 3 \; switch-client -T resize
bind -T resize j resize-pane -D 3 \; switch-client -T resize
bind -T resize k resize-pane -U 3 \; switch-client -T resize
bind -T resize l resize-pane -R 3 \; switch-client -T resize
bind -T resize Escape switch-client -T root
bind -T resize q switch-client -T root

# Look up in a man-page
bind m command-prompt -p "Man:" "split-window 'man %%'"

# Pickers (native display-popup + fzf; no plugin manager)

# Session picker — S, the fuzzy version of choose-tree: "C-r, but for sessions".
# Mechanics that will bite anyone editing this:
#  - the script is ONE single-quoted tmux argument, so #{...} and $var reach the
#    shell untouched (a double-quoted argument would let tmux expand both first).
#    A trailing \ continues the line but inserts NO newline, so every statement
#    needs its own ';' and a shell '#' comment is impossible in here.
#  - session names may contain spaces, so the list is tab-delimited and the name
#    comes back out with `cut -f1`. Every target carries tmux's '=' exact-match
#    prefix: a plain `foo` also matches `foobar`.
#  - sort key 1 is "unattached first", key 2 is last-attached descending, so the
#    session you came from sits under the cursor and the one you are attached to
#    sits at the bottom — and ctrl-x refuses it anyway.
#  - FZF_DEFAULT_COMMAND (not a pipe) so ctrl-x's reload re-runs the identical
#    listing without a second copy of it in this file.
#  - SHELL=/bin/sh is load-bearing: fzf runs --preview and execute-silent through
#    $SHELL, and in zsh a word starting with an unquoted '=' is EQUALS expansion,
#    so `-t ={1}` became "zsh:1: main not found" instead of an exact-match target.
#    fzf's own quoting doesn't save it — `='main'` expands too. sh has no such rule.
#  - no fzf: fall back to the choose-tree this key used to be.
bind S display-popup -E -w 70% -h 60% -T ' sessions ' 'command -v fzf >/dev/null 2>&1 || { tmux choose-tree -Zs; exit 0; }; \
  tab=$(printf "\t"); cur=$(tmux display-message -p "#{session_name}"); \
  slist="tmux list-sessions -F \"#{?session_attached,0,1}${tab}#{session_last_attached}${tab}#{session_name}${tab}#{session_windows} win#{?session_attached, [attached],}\" | sort -t\"${tab}\" -k1,1nr -k2,2nr | cut -f3-"; \
  sel=$(FZF_DEFAULT_COMMAND="$slist" SHELL=/bin/sh fzf --reverse --tabstop=20 --delimiter="${tab}" --prompt="session> " --header="enter switch   ctrl-x kill" --preview-window="right,55%" --preview "tmux list-windows -t ={1} -F \"#{window_index}: #{window_name}#{?window_active, (active),} [#{window_panes}p]\"" --bind "ctrl-x:execute-silent(test {1} != \"$cur\" && tmux kill-session -t ={1} || tmux display-message \"[tmux] not killing the session you are attached to\")+reload($slist)"); \
  name=$(printf "%s" "$sel" | cut -f1); \
  [ -n "$name" ] && tmux switch-client -t "=$name"'

# URL picker — u, what tmux-fzf-url did, natively. Scrape the pane's scrollback,
# dedupe, fzf it, hand the choice to `open`. -J unwraps a URL the pane split
# across lines, which is why this can't be a grep of the visible screen.
# capture-pane and display-message take no -t on purpose: inside a popup the
# default target is still the pane the key was pressed in, while $TMUX_PANE is
# the popup's own id and would capture the popup itself.
# Blind spot worth knowing before you debug this: Claude Code's fullscreen
# renderer draws on the ALTERNATE screen, and tmux keeps no scrollback for
# that — an alt-screen pane reports history_size 0, and -S - returns just the
# visible rows. So u and O see one screen of a Claude pane, not its history,
# and quietly report "no URLs in this pane". Fullscreen is the default on
# recent installs. Ways out, most durable first: CLAUDE_CODE_DISABLE_ALTERNATE_SCREEN=1
# or /tui default (classic renderer, real scrollback); or per-session, C-o for
# transcript mode then [, which writes the conversation into native scrollback
# where copy-mode and both pickers can see it (Esc or q comes back).
# $q holds a single quote and a backtick built with printf — neither can be typed
# inside this single-quoted argument — so prose that wraps a URL in them doesn't
# drag them in. Tab multi-selects.
# Trailing punctuation is trimmed in the awk, not with a character class: a
# blanket "strip any of ].,;:!?)}*" also truncated URLs that legitimately end
# in one, and a closing paren is the common case (…/wiki/Foo_(bar)). So
# sentence punctuation always goes, and a trailing ) or } goes only when the
# URL carries no matching opener. The dedupe rides in the same pass — it has
# to happen after the trim, or one URL survives twice with different tails.
bind u display-popup -E -w 80% -h 60% -T ' urls ' 'command -v fzf >/dev/null 2>&1 || { tmux display-message "[tmux] the URL picker needs fzf"; exit 0; }; \
  q=$(printf "\47\140"); \
  urls=$(tmux capture-pane -p -J -S - | grep -oE "[a-zA-Z][a-zA-Z0-9+.-]*://[^[:space:]<>\"$q]+" | awk "{u=\$0; sub(/[.,;:!?]+\$/, \"\", u); sub(/\*+\$/, \"\", u); if (u ~ /\)\$/ && u !~ /\(/) sub(/\)+\$/, \"\", u); if (u ~ /}\$/ && u !~ /{/) sub(/}+\$/, \"\", u); sub(/[.,;:!?]+\$/, \"\", u); if (u != \"\" && !seen[u]++) print u}"); \
  [ -n "$urls" ] || { tmux display-message "[tmux] no URLs in this pane"; exit 0; }; \
  printf "%s\n" "$urls" | fzf --reverse --tac --multi --prompt="url> " --header="enter open   tab multi-select" | while IFS= read -r u; do open "$u"; done'

# Agent-log pager — g, the third popup. Agents tee long command output to
# ~/.cache/agent-logs/<job>.log (the convention in ~/.claude/CLAUDE.md and the
# tmux-panes skill) instead of pasting a wall of text into the transcript; this
# is how you read it. Same one-single-quoted-argument rules as the pickers above.
# Newest first, because the log you want is almost always the one just written.
# The preview runs bare {}, not "$dir/{}": fzf preview children are sh -c with a
# fresh environment, and $dir is a plain popup-shell variable, never exported —
# it expands to empty there and every preview tails a nonexistent /<name>. The
# cd above already puts fzf (and so the preview) in $dir, so {} alone resolves.
# $PAGER is not used: less -R is required to render the ANSI a tee'd log keeps.
bind g display-popup -E -w 80% -h 70% -T ' agent logs ' 'dir="$HOME/.cache/agent-logs"; \
  [ -d "$dir" ] && [ -n "$(ls -A "$dir" 2>/dev/null)" ] || { tmux display-message "[tmux] no agent logs yet"; exit 0; }; \
  command -v fzf >/dev/null 2>&1 || { ls -t "$dir" | head -20; printf "\n[install fzf for the picker — enter to close] "; read _; exit 0; }; \
  sel=$(cd "$dir" && ls -t | SHELL=/bin/sh fzf --reverse --prompt="log> " --header="enter page   esc cancel" --preview-window="right,60%" --preview "tail -200 {}"); \
  [ -n "$sel" ] && less -R "$dir/$sel"'

# Agent teams — A opens a lead Claude in a window of its own, because the tmux
# backend runs select-layout main-vertical on the window it starts in, which
# discards whatever layout that window had — it would flatten the editor/agent
# stack you were working in.
#
# --teammate-mode tmux, not auto: the default flipped from auto to in-process
# in v2.1.179, so an explicit value is now required, and naming it states the
# intent rather than relying on auto's terminal sniffing. The flag is hidden
# from `claude --help` by design, not removed.
# The old reason given here — that $TMUX is empty inside Claude's own process —
# is false; a probe pane reports the socket path. That rule is about the *Bash
# tool's* subprocess, not about a program tmux launches as a pane command.
#
# Cap yourself at 2-3 teammates, and note the axis: the backend splits -h at
# 70% and then stacks teammates VERTICALLY in that right column, so each gets
# (client_height - 1) / N rows. On a 50-row terminal three teammates get ~16
# rows each and a fourth drops below what the TUI needs. Width is never the
# constraint. Teammate panes also get their own window-style, which overrides
# the palette above until you `set -p -u -t <pane> window-style`.
bind A new-window -n agents -c "#{pane_current_path}" \
  "CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1 claude --teammate-mode tmux"

# Ask Claude — a, the one-shot sibling of A. Type a question, get an answer,
# without splitting the pane you are reading or starting a session you then
# have to tend. Runs in the cwd of the pane the key was pressed in, so "what
# does this script do" has the right context.
#
# Deliberately NOT an interactive claude. A popup has no pane id at all: it
# does not appear in list-panes, so tmux-agent-state cannot badge it, the
# is_claude ps check below cannot see it, capture-pane cannot read it, and
# tmux-snapshot cannot record it — and it belongs to the client, so it dies
# on detach and cannot be zoomed, navigated to, or left running. An agent you
# want to come back to is a pane: C-a C for a task window, C-a A for a team.
# Same rule as the scratch popup below — leave nothing long-running in here.
bind a display-popup -E -w 80% -h 70% -T ' ask claude ' -d "#{pane_current_path}" 'command -v claude >/dev/null 2>&1 || { tmux display-message "[tmux] claude is not on PATH"; exit 0; }; \
  printf "ask> "; IFS= read -r q || exit 0; [ -n "$q" ] || exit 0; \
  printf "\n"; claude -p "$q" 2>&1 | less -R'

# Scratch shell — Enter, a shell floating over the window you are in. The one
# thing the pickers above can't be: a place to run `git log`, a curl, a one-off
# script without splitting the pane you are reading. -d so it opens in the cwd
# of the pane the key was pressed in, not wherever the server was started.
# No -E, so the popup does NOT close when the shell exits — `exit` or C-d
# leaves you looking at a dead popup and Escape is what dismisses it. (-E would
# close on exit but also close the moment anything in it finished.) Popups are
# not panes — this one has no place in the pane list and cannot be navigated
# to, so leave nothing long-running in it.
bind Enter display-popup -w 80% -h 75% -T ' scratch ' -d "#{pane_current_path}"

# Git picker — G, the fourth popup. Working-tree changes, fzf'd, with a real
# diff in the preview; Enter opens the file in nvim in a window of its own.
# Details that will bite:
#  - delta is core.pager, and git turns the pager off the moment stdout is not
#    a tty, so a preview of plain `git diff` would be uncoloured. The diff is
#    piped into delta explicitly, with --width=$FZF_PREVIEW_COLUMNS: delta
#    assumes 80 columns off a tty and wraps mid-hunk in a 60%-wide preview.
#  - untracked files have no diff at all, so ?? previews through bat instead.
#  - the list is status<tab>path, not porcelain's "XY path": an unstaged entry
#    starts with a space, so splitting on plain whitespace loses the path, and
#    -d '\t' with {2} survives that. Two more things porcelain does that a
#    single sed could not, hence the read loop: a rename prints
#    "R  old -> new", which reached nvim as a buffer literally named
#    "old -> new"; and a path holding a space, a quote or a backslash comes
#    back C-quoted ("with space.txt"), which reached nvim with the quotes
#    still attached. The loop takes the post-arrow path and unwraps a leading
#    quote. core.quotepath=false is what stops a non-ASCII name arriving as
#    \303\251 octal, which has no sane un-escaping in POSIX sh.
#  - the filename reaches nvim through -e F=, not string interpolation, so a
#    path with a space in it still opens as one argument.
#  - the window name has its dots and colons stripped: they are tmux's own
#    pane and window separators, so a window called "tmux.md" is unreachable
#    as main:tmux.md — tmux reads that as pane "md" of window "tmux".
bind G display-popup -E -w 90% -h 80% -T ' git ' -d "#{pane_current_path}" 'command -v fzf >/dev/null 2>&1 || { tmux display-message "[tmux] the git picker needs fzf"; exit 0; }; \
  root=$(git rev-parse --show-toplevel 2>/dev/null) || { tmux display-message "[tmux] not a git repo"; exit 0; }; \
  cd "$root" || exit 1; \
  [ -n "$(git status --porcelain)" ] || { tmux display-message "[tmux] working tree is clean"; exit 0; }; \
  sel=$(git -c core.quotepath=false status --porcelain | while IFS= read -r line; do st=$(printf %s "$line" | cut -c1-2); pth=$(printf %s "$line" | cut -c4-); case $pth in *" -> "*) pth=${pth##* -> };; esac; case $pth in \"*) pth=${pth#\"}; pth=${pth%\"}; pth=$(printf %s "$pth" | sed -e "s/\\\\\"/\"/g" -e "s/\\\\\\\\/\\\\/g");; esac; printf "%s\t%s\n" "$st" "$pth"; done | SHELL=/bin/sh fzf --reverse --delimiter="\t" --with-nth=1,2 \
    --prompt="changed> " --header="enter edit   esc cancel" --preview-window="right,60%" \
    --preview "case {1} in \"??\") bat --color=always --style=plain -- {2};; *) git diff --color=always HEAD -- {2} | delta --width=\$FZF_PREVIEW_COLUMNS;; esac"); \
  [ -n "$sel" ] || exit 0; \
  f=$(printf "%s" "$sel" | cut -f2); \
  tmux new-window -c "$root" -e "F=$f" -n "$(basename "$f" | tr ".:" "--")" "nvim \"\$F\""'

# Path picker — O, the URL picker's sibling for file paths. Agents print
# paths constantly (file.go:42, ./scripts/verify, a stack frame), and with
# hyperlinks now negotiated some are even clickable — but most are not, and
# copying one out of a scrollback by hand is the friction this removes.
# The existence test is the whole trick: a bare regex over prose matches half
# the sentence, so every candidate is kept only if it resolves to a real file
# relative to the pane's cwd. A trailing :LINE is split off first and handed
# to nvim as +LINE, so a compiler error lands on the offending line — and the
# preview is --line-range'd around it, because a bare --highlight-line still
# renders from line 1 and leaves the match off-screen in any real file.
# Two rules both consumers must repeat, and used not to:
#  - cut the line number with #*: and THEN %%:* — shortest prefix, then
#    longest suffix. file.go:12:3 is the dominant form (rustc, tsc, eslint,
#    gcc, rg --column, every stack frame), and #*: alone made the "line" the
#    string "12:3": that killed the entire preview at $((…)), because /bin/sh
#    here is bash 3.2 and it aborts the script rather than the expression, and
#    made the jump `nvim +12:3` -> E492. The case guard covers file:abc too.
#  - expand a leading ~ again. The harvest below expands it before testing
#    existence, so ~/… candidates are offered — but nvim does NOT expand ~ in
#    a file argument, so without repeating it you get an empty buffer named
#    ~/… whose first :w creates a directory called ~. ~/.cache/agent-logs/
#    makes this an everyday path here, not a corner case.
bind O display-popup -E -w 80% -h 70% -T ' paths ' 'command -v fzf >/dev/null 2>&1 || { tmux display-message "[tmux] the path picker needs fzf"; exit 0; }; \
  cwd=$(tmux display-message -p "#{pane_current_path}"); cd "$cwd" || exit 1; \
  hits=$(tmux capture-pane -p -J -S - | tr " \t()[]<>\"" "\n" | sed -e "s/[.,;:]*$//" -e "s/^[\"(]*//" | grep -E "^[~./]|/" | sort -u | while IFS= read -r c; do \
    p=${c%%:*}; case $p in "~"*) p=$HOME${p#\~};; esac; [ -e "$p" ] && printf "%s\n" "$c"; done); \
  [ -n "$hits" ] || { tmux display-message "[tmux] no existing paths in this pane"; exit 0; }; \
  sel=$(printf "%s\n" "$hits" | SHELL=/bin/sh fzf --reverse --prompt="path> " --header="enter edit   esc cancel" --preview-window="right,60%" \
    --preview "p={}; f=\${p%%:*}; case \$f in \"~\"*) f=\$HOME\${f#\\~};; esac; l=\${p#*:}; l=\${l%%:*}; [ \"\$l\" = \"\$p\" ] && l=1; case \$l in \"\"|*[!0-9]*) l=1;; esac; s=\$((l>10?l-10:1)); bat --color=always --style=numbers --highlight-line \"\$l\" --line-range \"\$s:\$((l+40))\" -- \"\$f\" 2>/dev/null || ls -la -- \"\$f\""); \
  [ -n "$sel" ] || exit 0; \
  f=${sel%%:*}; case $f in "~"*) f=$HOME${f#\~};; esac; l=${sel#*:}; [ "$l" = "$sel" ] && l=1; l=${l%%:*}; case $l in ""|*[!0-9]*) l=1;; esac; \
  tmux new-window -c "$cwd" -e "F=$f" -e "L=$l" -n "$(basename "$f" | tr ".:" "--")" "nvim +\$L \"\$F\""'

# Sessions on disk — W writes a snapshot now, V revives everything in it.
# The autosave on status-right (see above) means W is rarely needed; V is the
# one that matters, on the morning after a reboot or a `tmux kill-server`.
# A snapshot holds session names, window indexes and names, each window's
# layout string, and every pane's cwd — deliberately NOT the commands that
# were running. Restoring those is how resurrect-style tools re-run a
# migration at you; panes come back as shells and you restart what you meant
# to. V never touches a session that already exists, so it is safe to press
# twice, and safe to press when only some of your sessions are gone.
bind W run-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux-snapshot" save && tmux display-message "[tmux] snapshot written"'
bind V run-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux-snapshot" restore'

# The autosave. This used to ride a #() on status-right, on the theory that a
# status job was the only periodic hook available without a plugin manager;
# tmux 3.5 made that false. Hooks fire on the actual events, so the save
# happens when the shape changes rather than up to a status-interval later,
# and no shell is forked when nothing has happened.
# The brace block is load-bearing: it defers parsing, so the single-quoted
# run-shell argument survives tmux's own ${...} expansion — the same trap the
# old status-right comment documented.
# NOT window-layout-changed, deliberately: it fires once per resize-pane step,
# so holding j in the prefix-R resize table would fire a save per keystroke —
# and since the layout genuinely differs each time, save()'s no-change guard
# would not stop it, rotating a good snapshot into .prev on every press.
# client-detached is the catch-all instead, because neither a resize nor a
# `cd` has a hook of its own and both change the recorded shape.
# Un-backgrounded on purpose (~23ms): -b on client-detached races the client
# teardown. The concurrency this does introduce — session-closed and
# window-unlinked both fire on one close — is handled by the wait-for lock in
# tmux-snapshot itself.
set-hook -g session-created  { run-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux-snapshot" save auto' }
set-hook -g session-closed   { run-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux-snapshot" save auto' }
set-hook -g session-renamed  { run-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux-snapshot" save auto' }
set-hook -g window-linked    { run-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux-snapshot" save auto' }
set-hook -g window-unlinked  { run-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux-snapshot" save auto' }
# Both of these are WINDOW-scoped hooks — pane-exited included, despite the
# name — so `tmux show-hooks -g` does not list them even though -g sets them
# and they fire correctly (verified both ways on 3.7c). They show up under
# `show-hooks -gw`; check there before concluding they failed to register.
# Also worth knowing what pane-exited does not cover: it means the pane's
# PROCESS exited. `kill-pane` fires neither it nor pane-died, so closing a pane
# by hand mid-window is caught only by client-detached, like a resize or a cd.
set-hook -g window-renamed   { run-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux-snapshot" save auto' }
set-hook -g pane-exited      { run-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux-snapshot" save auto' }
set-hook -g client-detached  { run-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux-snapshot" save auto' }

# The @agent badge rendered by window-status-format above. A bell from any
# pane — Claude Code's notification channel, or a plain `make` finishing —
# marks its window as wanting you; moving to a window clears whatever badge it
# carried. Claude's own hooks set running/done/wait more precisely via
# tmux-agent-state; this is the floor for everything that only rings.
set-hook -g alert-bell { run-shell -b 'tmux set-option -w -t "#{hook_window}" @agent wait; tmux refresh-client -S' }
set-hook -g session-window-changed { run-shell -b 'tmux set-option -w -u @agent; tmux refresh-client -S' }

# Which-key palette — F, the menu you reach for when you have forgotten a key.
# menu-style / menu-selected-style / menu-border-style are already themed
# above, so it matches the popups for free, and display-menu is stock tmux.
#
# Three rules this keeps.
#  - Strictly ADDITIVE: the letter shown IS the real binding, so using the
#    palette teaches the key rather than replacing it. A palette that becomes
#    the only route to something turns muscle memory into menu-hunting.
#  - NOTHING destructive. A menu is mouse-clickable and the pointer can land
#    on a row you did not read, so q / Q / C-q (kill pane / window / session)
#    are deliberately absent.
#  - No duplicated bodies. The five fzf popups (S u O G g) are not here: each
#    is a 10-20 line single-quoted shell program, and a second copy in this
#    menu would be a second copy to keep correct. `prefix ?` (last row) is
#    still the complete, honest list.
#
# Brace blocks, not quoted strings, for anything with a nested command: they
# defer parsing, so ${XDG_CONFIG_HOME:-...} reaches /bin/sh instead of being
# eaten by tmux's own expansion — the same trap that made an earlier version
# of this binding fail to load with "invalid environment variable".
bind F display-menu -T "#[align=centre] keys " -x C -y C \
  "session: new"                C-s { command-prompt -p "New session:" 'run-shell "n=\$(printf %s \"%%\" | tr .: __); [ -n \"\$n\" ] || exit 0; tmux has-session -t \"=\$n\" 2>/dev/null || tmux new-session -d -s \"\$n\" -c \"#{pane_current_path}\"; tmux switch-client -t \"=\$n\""' } \
  "session: last"               L { switch-client -l } \
  "session: tunnel"             T { if-shell "tmux has-session -t=tunnel" { switch-client -t=tunnel } { new-session -d -s tunnel ; switch-client -t=tunnel } } \
  "" \
  "window: task (nvim+claude)"  C { command-prompt -p "Task:" 'run-shell "n=\$(printf %s \"%%\" | tr .: __); [ -n \"\$n\" ] || exit 0; tmux new-window -n \"\$n\" -c \"#{pane_current_path}\" nvim; tmux split-window -h -l 40% -c \"#{pane_current_path}\" claude; tmux select-pane -L"' } \
  "window: new"                 c { new-window -c "#{pane_current_path}" } \
  "window: last"                Tab { last-window } \
  "" \
  "pane: split below"           s { split-window -v -c "#{pane_current_path}" } \
  "pane: split right"           v { split-window -h -c "#{pane_current_path}" } \
  "pane: zoom"                  z { resize-pane -Z } \
  "pane: numbers"               i { display-panes } \
  "pane: break out"             b { break-pane } \
  "pane: resize mode"           R { switch-client -T resize } \
  "pane: broadcast"             e { setw synchronize-panes ; display-message "[tmux] broadcast #{?pane_synchronized,ON,off}" } \
  "" \
  "scratch shell"               Enter { display-popup -w 80% -h 75% -T " scratch " -d "#{pane_current_path}" } \
  "claude: ask one question"    a { display-popup -E -w 80% -h 70% -T " ask claude " -d "#{pane_current_path}" 'command -v claude >/dev/null 2>&1 || { tmux display-message "[tmux] claude is not on PATH"; exit 0; }; printf "ask> "; IFS= read -r q || exit 0; [ -n "$q" ] || exit 0; printf "\n"; claude -p "$q" 2>&1 | less -R' } \
  "claude: team window"         A { new-window -n agents -c "#{pane_current_path}" "CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1 claude --teammate-mode tmux" } \
  "" \
  "snapshot: save now"          W { run-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux-snapshot" save && tmux display-message "[tmux] snapshot written"' } \
  "snapshot: restore"           V { run-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux-snapshot" restore' } \
  "reload config"               r { source-file ~/.tmux.conf ; display-message "[tmux] ~/.tmux.conf reloaded!" } \
  "all keys"                    ? { list-keys -N }

# Broadcast — e, type once into every pane in the window. A window-level toggle,
# so it dies with the window rather than following you around; the status line
# is the only thing that tells you it is on, hence the display-message.
bind e setw synchronize-panes \; display-message "[tmux] broadcast #{?pane_synchronized,ON,off}"

# Copy-mode

set -g mode-keys vi

unbind -T copy-mode-vi Space
unbind -T copy-mode-vi Enter
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# y was never the only path to the system clipboard, whatever docs/tmux.md
# said. set-clipboard is `external` by default, so anything that writes a tmux
# buffer is forwarded on as OSC 52 — and copy-mode-vi ships D as
# copy-pipe-end-of-line-and-cancel and A as append-selection-and-cancel. D is
# worth keeping, so it goes through pbcopy like y; A appends into the buffer
# with nowhere to pipe, so it goes.
bind -T copy-mode-vi D send-keys -X copy-pipe-end-of-line-and-cancel "pbcopy"
unbind -T copy-mode-vi A

# Selection is inert; copying is an act. Every default mouse path ends in
# copy-pipe-and-cancel, so a stray drag or double-click in the pane you are
# about to paste *into* overwrites the buffer you just filled in another pane.
# Rebound so the mouse only ever highlights: the pane stays in copy-mode and y
# above is the one thing that reaches pbcopy (and, since copy-pipe also fills
# the tmux buffer, prefix-] — unshadowed here — pastes it back into a pane).
# Escape drops the highlight, q / C-c leave copy-mode without copying.
# stop-selection ends the drag but keeps the range, so y works on a
# mouse-made selection exactly as on a v-made one.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line

# The same two clicks from a live pane enter copy-mode first and so hit the
# root table, which carries its own copy-pipe-and-cancel. Dropped from the
# defaults here: copy-mode -H (hid the position indicator — the pane now stays
# in copy-mode, so you need to see that it is) and run-shell -d 0.3 (a delay
# that only existed to let a third click land before the copy fired; nothing
# fires now). MouseDrag1Pane needs no override — it only enters copy-mode -M;
# the copy was always in the *End* binding.
bind -T root DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode ; send-keys -X select-word }
bind -T root TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode ; send-keys -X select-line }

# The emacs copy-mode table keeps its own defaults, which still end
# MouseDragEnd1Pane / DoubleClick1Pane / TripleClick1Pane in copy-pipe-and-cancel.
# mode-keys is vi and there is no fallback from copy-mode-vi to copy-mode, so
# nothing reaches these today — but a single `setw mode-keys emacs` anywhere
# would restore mouse-copies-to-clipboard without touching this file.
bind -T copy-mode MouseDragEnd1Pane send-keys -X stop-selection
bind -T copy-mode DoubleClick1Pane select-pane \; send-keys -X select-word
bind -T copy-mode TripleClick1Pane select-pane \; send-keys -X select-line

# A two-finger tap opens the default menu and the next click can land on one of
# its Copy rows, so plain right-click goes to the application instead and the
# full menu stays on prefix > and M-right-click. Note the old reason given
# here was wrong: the menu's "Copy <word>" / "Copy Line" rows use copy-pipe
# into the tmux buffer and do not reach the system clipboard. The reason to
# keep this binding is that a stray menu click still clobbers the tmux buffer
# prefix-] pastes from, and that right-click belongs to the application.
bind -T root MouseDown3Pane select-pane -t = \; send-keys -M

# Smart pane switching with awareness of Vim splits (and fzf for C-j/C-k).
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
is_fzf="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?fzf$'"
# Ctrl+J is Claude Code's "works in every terminal, no setup" newline chord —
# the fallback for terminals that cannot send S-Enter. Forwarding only to vim
# and fzf meant a Claude pane here had no working newline chord at all, since
# extended-keys was off too (it is on now, near the top of this file; this is
# the belt to that braces).
# Matched on ps, NOT on #{pane_current_command}: a native install reports the
# versioned binary there — measured "2.1.241", not "claude". ps -o comm= says
# claude.
# The bargain, stated plainly: bare C-j / C-k stop moving between panes while
# focus is in a Claude pane. prefix j / prefix k still do — the identical
# trade already made for vim.
is_claude="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?claude$'"
bind-key -n C-h if-shell "($is_vim || $is_claude)" "send-keys C-h"  "select-pane -L"
bind-key -n C-j if-shell "($is_vim || $is_fzf || $is_claude)" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "($is_vim || $is_fzf || $is_claude)" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "($is_vim || $is_claude)" "send-keys C-l" "select-pane -R"
# These two are NOT forwarded to nvim, unlike C-hjkl above. init.lua maps
# <C-h/j/k/l> and nothing else, so a forwarded C-\ landed on nvim's own
# C-\ C-n prefix and sat there swallowing your next keystroke, and a
# forwarded C-Space did nothing at all. tmux keeps both unconditionally.
bind-key -n 'C-\' select-pane -l
bind-key -n 'C-Space' select-pane -t:.+

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+

# Machine-local overrides, sourced last and untracked — the tmux twin of
# ~/.gitconfig.local and ~/.zshenv.local, seeded by install.sh. This file is a
# symlink into a public repo, so anything private or host-specific belongs
# there. It is also where the platform split goes: `y` pipes to pbcopy and the
# URL picker calls `open`, both macOS-only, and %if cannot help — it is
# evaluated at parse time and #() is async, so %if "#{==:#(uname),Darwin}"
# takes the else branch ON macOS. Use if-shell there, or just override the
# two bindings. -q so a machine without the file loads silently.
source-file -q ~/.tmux.conf.local
