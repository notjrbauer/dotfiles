# vim:fdm=marker expandtab fdc=3 ft=tmux ts=2 sw=2 sts=2:
#
# Hierarchy:
#  Server
#  ㄴSession
#    ㄴWindow
#      ㄴPane

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'wfxr/tmux-fzf-url'

# Terminal layering — tmux owns the C-a layer; the terminals (wezterm
# config/bindings.lua, ghostty config) bind SUPER-only chords and deliberately
# no ctrl keys, so the prefix reaches tmux single-tap. The prefix bindings
# below carry the old wezterm-LEADER muscle memory: splits " % s v, zoom z,
# resize - = ( ) and sticky R-mode, copy mode [, windows c/n/p/Tab, plus bare
# C-h/j/k/l pane navigation (vim/fzf-aware) further down.

# General

# $TERM inside tmux must be tmux/screen or a derivative (see tmux(1)).
# Not a redundant default: TMUX_TERM is baked in at build time and can be
# plain "screen" (no 256color/italics) on a self-compiled tmux.
set -g default-terminal "tmux-256color"

set -g mouse on

# default-shell defaults to $SHELL (login shell) — no hardcoded brew path,
# which breaks across Intel (/usr/local) vs Apple Silicon (/opt/homebrew).
set -s escape-time 0

# Neovim: https://github.com/neovim/neovim/wiki/FAQ#esc-in-tmux-or-gnu-screen-is-delayed
set -s focus-events on

set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Terminal window title
set -g set-titles on
set -g set-titles-string "[tmux] #T @ #H"

set -g display-time 3500
set -g history-limit 100000

# Start window and pane indexes at 1
set -g base-index 1
set -g pane-base-index 1

# Appearance — same palette as wezterm colors/custom.lua
# (slightly-altered Catppuccin Mocha; base #1f1f28)

# Truecolor passthrough for the terminals in use
set -ga terminal-overrides ",xterm-256color:RGB,wezterm:RGB,xterm-ghostty:RGB"

set -g status-position top
set -g monitor-activity on
set -g visual-activity on

# status content: left = session name only; right = clock. Defaults added a
# per-pane border line (pane index + hostname + mouse [z]oom/[x]close buttons)
# and hostname+date on the right — noise on a single laptop.
set -g status-left "[#S] "
set -g status-right " %H:%M "

# status bar (wezterm tab_bar.background ~ mantle)
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-style "bg=#181825,fg=#89b4fa"
set -g status-right-style "bg=#181825,fg=#a6adc8"

# window list — mirrors wezterm tab_bar active / inactive / hover
set -g window-status-style "bg=#313244,fg=#bac2de"
set -g window-status-current-style "bg=#585b70,fg=#cdd6f4,bold"
set -g window-status-last-style "bg=#313244,fg=#cdd6f4"
set -g window-status-activity-style "bg=#313244,fg=#f9e2af"
set -g window-status-bell-style "bg=#f38ba8,fg=#11111b"

# panes (split = overlay0; active border = blue for visibility)
set -g pane-border-style "fg=#6c7086"
set -g pane-active-border-style "fg=#89b4fa"

# messages / command prompt
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#f5c2e7"

# copy mode (selection = surface2, like wezterm selection_bg/fg)
set -g mode-style "bg=#585b70,fg=#cdd6f4"
set -g copy-mode-match-style "bg=#f9e2af,fg=#11111b"
set -g copy-mode-current-match-style "bg=#fab387,fg=#11111b"
set -g copy-mode-mark-style "bg=#f5e0dc,fg=#11111b"

# misc
set -g clock-mode-colour "#89b4fa"
set -g display-panes-colour "#6c7086"
set -g display-panes-active-colour "#89b4fa"
set -g menu-style "bg=#313244,fg=#cdd6f4"
set -g menu-selected-style "bg=#585b70,fg=#cdd6f4"
set -g menu-border-style "fg=#6c7086"
set -g popup-style "bg=#1f1f28,fg=#cdd6f4"
set -g popup-border-style "fg=#6c7086"

# Reload config file
bind r source-file ~/.tmux.conf \; display-message "[tmux] ~/.tmux.conf reloaded!"
bind C-r source-file ~/.tmux.conf \; display-message "[tmux] ~/.tmux.conf reloaded!"

# Clients

bind N switch-client -n
bind P switch-client -p

# Windows

bind c new-window -c "#{pane_current_path}"
bind Tab last-window
bind -r C-h select-window -t :-
bind -r C-l select-window -t :+
bind Q kill-window

# Panes

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

bind q kill-pane
bind C-q kill-session
bind b break-pane
bind i display-panes

# One-shot resizes (wezterm LEADER -/=/(/), same 10-cell steps)
bind - resize-pane -U 10
bind = resize-pane -D 10
bind ( resize-pane -L 10
bind ) resize-pane -R 10

# Resize mode: prefix R, then h/j/k/l repeatedly; Escape or q exits.
# Mirrors wezterm's LEADER-r resize_pane key table (prefix r reloads the conf
# here, hence R). switch-client -T only lasts for one key, so every resize
# re-arms the table — sticky like wezterm's one_shot = false.
bind R switch-client -T resize
bind -T resize h resize-pane -L 3 \; switch-client -T resize
bind -T resize j resize-pane -D 3 \; switch-client -T resize
bind -T resize k resize-pane -U 3 \; switch-client -T resize
bind -T resize l resize-pane -R 3 \; switch-client -T resize
bind -T resize Escape switch-client -T root
bind -T resize q switch-client -T root

# Look up in a man-page
bind m command-prompt -p "Man:" "split-window 'man %%'"

# Copy-mode

set -g mode-keys vi

unbind -T copy-mode-vi Space
unbind -T copy-mode-vi Enter
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Smart pane switching with awareness of Vim splits (and fzf for C-j/C-k).
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
is_fzf="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?fzf$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n C-j if-shell "($is_vim || $is_fzf)" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "($is_vim || $is_fzf)" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'
bind-key -n 'C-Space' if-shell "$is_vim" 'send-keys C-Space' 'select-pane -t:.+'

bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+

run -b '~/.tmux/plugins/tpm/tpm'
