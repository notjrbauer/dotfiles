# vim:ft=tmux ts=2 sw=2 sts=2 et:
# Key reference and the reasoning behind these choices: docs/tmux.md

# --- server / general ---------------------------------------------------

set -s escape-time 0          # 3.7's default is 10ms, which nvim shows as an ESC delay
set -s focus-events on        # nvim's FocusGained/FocusLost (autoread, lualine)
# Measured in a pane: without these Shift-Enter arrives as a bare ^M, with them
# as ^[[13;2u. csi-u sends S-Tab as CSI 9;2u — if fzf stops seeing S-Tab, fall
# back to `set -s extended-keys-format xterm`.
set -s extended-keys on
set -s extended-keys-format csi-u

set -g mouse on
set -g history-limit 100000
set -g display-time 3500
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off  # killing the attached session would drop you out of tmux
# all, not on: `on` forwards passthrough only from a VISIBLE pane, and the
# OSC 777 toast tmux-agent-state sends is for the agent you are not looking at.
set -g allow-passthrough all  # Claude Code's DCS-wrapped sequences, and our toast
# -ga, not -g: a plain -g wipes the 13 stock entries including SSH_AUTH_SOCK.
# Sessions restored headlessly at boot inherit no COLORTERM, so bat/delta drop
# to 256 colours until an attach from a real terminal refreshes it.
set -ga update-environment COLORTERM
set -g set-titles on
set -g set-titles-string "[tmux] #T @ #H"

set -g prefix C-a
unbind C-b
bind C-a send-prefix

# 3.7's floating pane, next to the ( ) resize keys. A window holding one grows a
# <...> section on #{window_layout} that select-layout rejects, so tmux-snapshot
# cannot restore that window.
unbind '*'

# --- terminal -----------------------------------------------------------

# 3.7's shipped feature rows carry neither sync (DECSET 2026) nor hyperlinks
# (OSC 8) for either terminal here. -ga, never -g: -g collapses the array and
# destroys the shipped rows. Takes a detach/reattach, not `prefix r` — check with
# `tmux display-message -p '#{client_termfeatures}'`.
# No RGB override: since 3.6 tmux adds RGB itself when the attaching client has
# COLORTERM=truecolor (both terminals set it), and it recognises WezTerm by its
# XTVERSION reply. extkeys is still needed for Ghostty, which has no built-in row.
set -ga terminal-features "xterm-256color:hyperlinks:sync:osc7:overline:extkeys"
set -ga terminal-features "xterm-ghostty:hyperlinks:sync:osc7:overline:extkeys"

# --- status line / colours (Catppuccin Mocha, as wezterm) ---------------

set -g status-position top
set -g status-right ' %H:%M'
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-style "bg=#181825,fg=#89b4fa"
set -g status-right-style "bg=#181825,fg=#a6adc8"

# @agent is written by .config/tmux/tmux-agent-state, wired to Claude Code's
# hooks in .claude/settings.json: red ! = wants you, green * = finished while
# you were elsewhere. The window_flags tail is mandatory, or tmux's own
# *, -, Z and ! flags silently disappear.
# A window whose active pane is a Claude shows a glyph and the agent's own
# title (what it is doing right now) instead of the window name. Older Claude
# Code reported its version string ("2.1.241") as the process name — the match
# gamov.io and others converge on — but current builds report plain "claude";
# match both, since either may still appear. The active-pane rule means a task
# window sitting on nvim shows its name; that is correct.
%hidden IS_CLAUDE='#{m/r:^(claude$|[0-9]+\.[0-9]+),#{pane_current_command}}'
set -g window-status-format         "#{?#{==:#{@agent},wait},#[fg=#f38ba8]! ,#{?#{==:#{@agent},done},#[fg=#a6e3a1]* ,}}#I:#{?$IS_CLAUDE,󱚝 #{=/24/…:pane_title},#W}#{?window_flags,#{window_flags}, }"
set -g window-status-current-format "#{?#{==:#{@agent},wait},#[fg=#f38ba8]! ,#{?#{==:#{@agent},done},#[fg=#a6e3a1]* ,}}#I:#{?$IS_CLAUDE,󱚝 #{=/24/…:pane_title},#W}#{?window_flags,#{window_flags}, }"
set -g window-status-style "bg=#313244,fg=#bac2de"
set -g window-status-current-style "bg=#585b70,fg=#cdd6f4,bold"
set -g window-status-last-style "bg=#313244,fg=#cdd6f4"
set -g window-status-activity-style "bg=#313244,fg=#f9e2af"
set -g window-status-bell-style "bg=#f38ba8,fg=#11111b"

set -g pane-border-style "fg=#6c7086"
set -g pane-active-border-style "fg=#89b4fa"
# Claude Code writes what it is doing to the terminal title, which tmux exposes
# as #{pane_title} — so the border is a per-pane agent status line.
set -g pane-border-status top
# The tail is 3.7's own clickable [z]oom/[u]nzoom and [x] close controls,
# which a custom format silently drops unless carried over.
set -g pane-border-format " #{pane_index}: #{pane_title} #{?#{mouse},#[align=right]#[range=control|8][#{?#{window_zoomed_flag},u,z}]#[norange] #[range=control|9][x]#[norange],}"

set -g message-style "fill=#313244,bg=#313244,fg=#cdd6f4"
set -g message-command-style "fill=#313244,bg=#313244,fg=#f5c2e7"
set -g mode-style "bg=#585b70,fg=#cdd6f4"
set -g copy-mode-match-style "bg=#f9e2af,fg=#11111b"
set -g copy-mode-current-match-style "bg=#fab387,fg=#11111b"
set -g copy-mode-mark-style "bg=#f5e0dc,fg=#11111b"
set -g clock-mode-colour "#89b4fa"
set -g display-panes-colour "#6c7086"
set -g display-panes-active-colour "#89b4fa"
set -g menu-style "bg=#313244,fg=#cdd6f4"
set -g menu-selected-style "bg=#585b70,fg=#cdd6f4"
set -g menu-border-style "fg=#6c7086"
set -g popup-style "bg=#1f1f28,fg=#cdd6f4"
set -g popup-border-style "fg=#6c7086"

# --- sessions -----------------------------------------------------------

bind r source-file ~/.tmux.conf \; display-message "[tmux] ~/.tmux.conf reloaded!"
bind S choose-tree -Zs
# tr .: __ — ':' and '.' are tmux's own target separators, so a session named
# "a.b" is created happily and is then unreachable forever.
bind C-s command-prompt -e -p "New session:" 'run-shell "n=\$(printf %s \"%%\" | tr .: __); [ -n \"\$n\" ] || exit 0; tmux has-session -t \"=\$n\" 2>/dev/null || tmux new-session -d -s \"\$n\" -c \"#{pane_current_path}\"; tmux switch-client -t \"=\$n\""'

# --- windows ------------------------------------------------------------

# -c is not optional: without it a new window or pane opens in the *client's*
# cwd, which is wherever the terminal was launched from.
bind c new-window -c "#{pane_current_path}"
# Task window: nvim left, claude right at 40%. Name sanitized as above.
bind C command-prompt -e -p "Task:" 'run-shell "n=\$(printf %s \"%%\" | tr .: __); [ -n \"\$n\" ] || exit 0; tmux new-window -n \"\$n\" -c \"#{pane_current_path}\" nvim; tmux split-window -h -l 40% -c \"#{pane_current_path}\" claude; tmux select-pane -L"'
bind Tab last-window          # `l` is a pane key here, so tmux's default is gone
bind Q confirm-before -p "kill window #W (#{window_panes} panes)? (y/n)" kill-window
bind e setw synchronize-panes \; display-message "[tmux] broadcast #{?pane_synchronized,ON,off}"

# --- panes --------------------------------------------------------------

# The only way out of a vim, fzf or claude pane by keyboard — bare C-hjkl are
# forwarded into those (see pane navigation at the bottom).
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind '"' split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

# A pane is cheap, so q is unguarded; a window or a session can hold an agent
# mid-task, so Q and C-q are not.
bind q kill-pane
bind C-q confirm-before -p "kill session #S (#{session_windows} windows)? (y/n)" kill-session
bind i display-panes          # tmux's default display-panes key is q, taken above

bind - resize-pane -U 10
bind = resize-pane -D 10
bind ( resize-pane -L 10
bind ) resize-pane -R 10

# --- popups -------------------------------------------------------------

# A popup is not a pane: no pane id, dies on detach, cannot be navigated to or
# snapshotted, so nothing long-running goes in one. No -E so an exited shell
# leaves its output on screen; -k so any key dismisses it after that.
bind Enter display-popup -k -w 80% -h 75% -T ' scratch ' -d "#{pane_current_path}"

# Agents tee long output to ~/.cache/agent-logs (the convention in
# ~/.claude/CLAUDE.md). The preview runs bare {} because the cd puts fzf's
# children in $dir; less -R because a tee'd log keeps its ANSI.
bind g display-popup -E -w 80% -h 70% -T ' agent logs ' 'dir="$HOME/.cache/agent-logs"; \
  [ -d "$dir" ] && [ -n "$(ls -A "$dir" 2>/dev/null)" ] || { tmux display-message "[tmux] no agent logs yet"; exit 0; }; \
  command -v fzf >/dev/null 2>&1 || { ls -t "$dir" | head -20; printf "\n[install fzf for the picker — enter to close] "; read _; exit 0; }; \
  sel=$(cd "$dir" && ls -t | SHELL=/bin/sh fzf --reverse --prompt="log> " --header="enter page   esc cancel" --preview-window="right,60%" --preview "tail -200 {}"); \
  [ -n "$sel" ] && less -R "$dir/$sel"'

# Jump to the Claude that needs you. `claude agents --json` is Claude Code's
# own list of live sessions (state: blocked = waiting on you); the SessionStart
# hook stamps each session's id on its tmux pane (@claude_session), so the pick
# maps straight to a pane. Needs an attached client (a popup), like prefix g.
bind a display-popup -E -w 70% -h 50% -T ' claude sessions ' '\
  sel=$(claude agents --json 2>/dev/null | jq -r ".[] | \"\\(.sessionId)\\t\\(.state // .status // \"\")\\t\\(.name // \"\")\\t\\(.cwd | split(\"/\") | last)\"" \
        | fzf --reverse --with-nth=2.. --delimiter="\t" --prompt="claude> " --header="state  name  dir") || exit 0; \
  id=${sel%%	*}; \
  pane=$(tmux list-panes -a -F "#{pane_id} #{@claude_session}" | awk -v id="$id" "\\$2==id{print \\$1;exit}"); \
  [ -n "$pane" ] && tmux switch-client -t "$pane" && tmux select-pane -t "$pane" \
    || tmux display-message "[tmux] session $id has no pane on this server"'

# Its own window, not a split: the tmux teammate backend runs select-layout
# main-vertical and would flatten the layout it starts in. Cap at 2-3 teammates
# — they stack vertically in the right column, so each gets (height - 1) / N.
bind A new-window -n agents -c "#{pane_current_path}" \
  "CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS=1 claude --teammate-mode tmux"

# --- sessions on disk ---------------------------------------------------

# W saves now, V recreates the sessions in the snapshot that are missing (it
# never touches one that exists). Panes come back as shells in the right cwd;
# the commands that were running are deliberately not recorded.
bind W run-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux-snapshot" save && tmux display-message "[tmux] snapshot written"'
bind V run-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux-snapshot" restore'

# The autosave. NOT window-layout-changed: it fires once per resize step and
# would rotate a good snapshot into .prev on every keypress. client-detached is
# the catch-all for a resize or a cd, neither of which has a hook of its own.
# The brace blocks defer parsing so ${XDG_CONFIG_HOME} reaches /bin/sh.
# window-renamed and pane-exited are window-scoped — they fire, but only
# `show-hooks -gw` lists them.
set-hook -g session-created  { run-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux-snapshot" save auto' }
set-hook -g session-closed   { run-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux-snapshot" save auto' }
set-hook -g session-renamed  { run-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux-snapshot" save auto' }
set-hook -g window-linked    { run-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux-snapshot" save auto' }
set-hook -g window-unlinked  { run-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux-snapshot" save auto' }
set-hook -g window-renamed   { run-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux-snapshot" save auto' }
set-hook -g pane-exited      { run-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux-snapshot" save auto' }
set-hook -g client-detached  { run-shell '"${XDG_CONFIG_HOME:-$HOME/.config}/tmux/tmux-snapshot" save auto' }

# Any bell badges its window; moving to a window clears it. The floor for
# anything that only rings — WezTerm has no desktop-notification channel, so
# .claude/settings.json sets preferredNotifChannel terminal_bell.
set-hook -g alert-bell { run-shell -b 'tmux set-option -w -t "#{hook_window}" @agent wait; tmux refresh-client -S' }
# Clearing needs an explicit target. Inside a hook's run-shell the child tmux
# has no client, so an untargeted `set-option -w -u` resolved to the wrong
# window and the badge stayed (measured with a real attached client). The
# format expands in the hook's client context, so #{window_id} is the window
# that client now shows — for a window switch and for a session switch alike.
set-hook -g session-window-changed { run-shell -b 'tmux set-option -w -t "#{window_id}" -u @agent; tmux refresh-client -S' }
set-hook -g client-session-changed { run-shell -b 'tmux set-option -w -t "#{window_id}" -u @agent; tmux refresh-client -S' }

# --- copy mode ----------------------------------------------------------

set -g mode-keys vi

unbind -T copy-mode-vi Space
unbind -T copy-mode-vi Enter
unbind -T copy-mode-vi A
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi D send-keys -X copy-pipe-end-of-line-and-cancel "pbcopy"

# Selection is inert; only y copies. Every default mouse path ends in
# copy-pipe-and-cancel, so a stray drag in the pane you are about to paste into
# would clobber the buffer you just filled in another one.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X stop-selection
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line
bind -T root DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode ; send-keys -X select-word }
bind -T root TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode ; send-keys -X select-line }
# Click to get out: at the bottom of the scrollback a plain mouse-down leaves
# copy mode, so a click that drifted into a drag does not eat your next
# keystrokes. Scrolled back it does nothing, so reading history keeps its place.
bind -T copy-mode-vi MouseDown1Pane select-pane \; if -F "#{==:#{scroll_position},0}" { send-keys -X cancel }
bind -T copy-mode    MouseDown1Pane select-pane \; if -F "#{==:#{scroll_position},0}" { send-keys -X cancel }
# Right-click belongs to the application; the default menu stays on prefix >.
bind -T root MouseDown3Pane select-pane -t = \; send-keys -M

# --- pane navigation (vim-tmux-navigator) -------------------------------

# Vim- and fzf-aware: when the pane's foreground program is nvim/vim or fzf the
# key is passed through, otherwise tmux moves. nvim's own C-hjkl maps hop to
# the adjacent tmux pane at a window edge (init.lua win_or_tmux), fzf keeps
# C-j/C-k for its list, blink keeps C-Space, and :terminal keeps its C-\ C-n
# exit. Claude Code panes are deliberately NOT in the pattern — it binds none
# of these, so passing them through would only strand you in the pane.
# #{m/r:…} is a regex match on pane_current_command (3.7); no ps fork.
%hidden IS_VIM='#{m/r:^(n?vim?x?|view|fzf)$,#{pane_current_command}}'
bind-key -n C-h if-shell -F "$IS_VIM" { send-keys C-h } { select-pane -L }
bind-key -n C-j if-shell -F "$IS_VIM" { send-keys C-j } { select-pane -D }
bind-key -n C-k if-shell -F "$IS_VIM" { send-keys C-k } { select-pane -U }
bind-key -n C-l if-shell -F "$IS_VIM" { send-keys C-l } { select-pane -R }
bind-key -n 'C-\' if-shell -F "$IS_VIM" { send-keys 'C-\' } { select-pane -l }
bind-key -n 'C-Space' if-shell -F "$IS_VIM" { send-keys C-Space } { select-pane -t:.+ }

# Without these C-hjkl do nothing once a pane is in copy mode, which the mouse
# bindings above make common.
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind-key -T copy-mode-vi 'C-Space' select-pane -t:.+

# Untracked, machine-local, sourced last — this is where the platform split
# goes, since y pipes to pbcopy and %if is evaluated at parse time.
source-file -q ~/.tmux.conf.local
